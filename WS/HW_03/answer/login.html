<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT's KOSTA - login</title>
<style>
  #login{
    padding: 20px 0;
  }

  #login h1{
    text-align: center;
    padding: 5px;
  }

  #login form{
    height: 200px;
    border: 1px solid gray;
    padding: 40px;
  }

  #login .form-item{
    margin-bottom: 10px;
  }

  #login .form-item label{
    display: inline-block;
    width: 100px;
    font-size: 18px;
  }

  
</style>
</head>
<body>
<div id="container">

 <!-- navbar  추가 -->

 
 <div id="login">
  <h1>Login</h1>
  <form action="" method="post">
   <div class="form-item">
    <label for="id">아이디</label>
    <input type="text" id="id" name="id">
    </div>
   
   <div class="form-item">
    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password">
    </div>
    
    <hr>
    <button>로그인</button>
  </form>
</div>   

  <!--footer영역 -->

    
 </div>
</body>
</html>
