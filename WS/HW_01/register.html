<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Register</h1>
    <form action="./index.html" method="post" novalidate>
    <label for="name">이름&nbsp;</label>
    <input type="text" id="name_tag" name="name">
    <br>
    <label for="email">이메일&nbsp;</label>
    <input type="email" id="email_tag" name="email">
    <br>
    <label for="phone">연락처&nbsp;</label>
    <input type="text" id="phone_tag" name="phone">
    <br>
    <label for="pw">비밀번호&nbsp;</label>
    <input type="password" id="pw_tag" name="pwd">
    <br>
    <label for="pw_confirm">비밀번호&nbsp;확인&nbsp;</label>
    <input type="password" id="pw_confirm_tag" name="pwd_confirm">
    <hr>
    <button type="submit">회원가입</button>
    </form>
</body>
</html>
