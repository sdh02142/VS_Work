<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Element : Form</h1>
    <!--
    form action은 submit 클릭 시, 폼 데이터를 전송할 URL을 지정.
    
    method는 폼 데이터를 전송할 HTTP 메서드를 지정.
    get : URL에 폼 데이터를 쿼리스트링(url parameters)으로 붙여서 전송. (보안에 취약, 데이터 길이 제한)
    post : 폼 데이터를 HTTP 메시지 본문(request body)에 담아 전송. (보안에 강함, 데이터 길이 제한 없음)
    -->
    <form action="ex01_start.html" method="post">
    <label for="id_tag">input id : </label>
    <input type="text" id="id_tag" name="id" size="5" maxlength="5" value = "id">
    <br>
    <label for="pw_tag">input password : </label>
    <input type="password" id="pw_tag" name="pwd" size="10" maxlength="10" value = "pwd">
    <br>
    <input type="submit" value="Login">
    </form>
</body>
</html>
