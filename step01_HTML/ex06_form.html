<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>HTML5에 추가된 form 요소 속성들</h2>
    <!--
    novalidate 속성은 form 요소에 추가하여, 브라우저의 기본 폼 검증 기능(required 같은)을 비활성화함.
    폼 검증 기능을 비활성화하면, 사용자가 입력한 값이 유효하지 않더라도 폼이 제출될 수 있음.
    폼 검증 기능을 비활성화하면, 서버 측에서 입력값 검증을 수행해야 함.
    -->
    <form action="ex01_start.html" method="get" novalidate>
        <input type="date" name="birthday" min="2026-08-10" max="2026-10-13">
        <br>
        <input type="text" name="name" id="name" placeholder="input your name" required>
        <br>
        <input type="email" name="email" id="email" placeholder="input your email" required>
        <br>
        <input type="number" name="age" id="age" placeholder="input your age">
        <br>

        <input type="month" name="month" id="month">
        <br>
        <input type="week" name="week" id="week">
        <br>
        <input type="time" name="time" id="time">
        <br>
        <input type="file" name="file" id="file">
        <!--
        file이 있을 경우, form의 method는 post, enctype속성을 반드시 추가해야 함.
        -->
        <br>
        <!--
        hidden type은 화면에 표시되지 않지만, 폼 데이터 전송 시 해당 필드의 값이 전송됨.
        Front-end에서 서버(Back-end)로 데이터를 전송할 때, 개발자 간의 데이터 공유를 위해 사용되며,
        보안에 취약하므로 민감한 정보는 주의해야함.
        -->
        <input type="hidden" name="message" value="Have a good day!">
        <input type="hidden" name="info" value="yes">

        <br>
        <!--
        select box
        -->
        <!--
        multiple 속성을 추가하면, 사용자가 여러 개의 옵션을 선택할 수 있음.
        여러 개의 옵션들을 선택하면 배열의 형태로 전송됨.
        -->
        <select name="job" id="job" size="3" multiple>
            <option value="개발자">개발자</option>
            <option value="디자이너">디자이너</option>
            <option value="기획자">기획자</option>
            <option value="0" selected>-- select job --</option>
            <option value="DBA">DBA</option>
            <option value="PM">PM</option>
            <option value="QA">QA</option>
        </select>

        <br>
        <label for="browser">Choose your browser from the list:</label>
  <input list="browsers" name="browser" id="browser">
  <datalist id="browsers">
    <option value="Edge">
    <option value="Firefox">
    <option value="Chrome">
    <option value="Opera">
    <option value="Safari">
  </datalist>

  <br>
  <!--
  textarea 요소는 여러 줄의 텍스트를 입력할 수 있는 입력 필드.
  <> 내부에 기본값을 넣을 때, 공백 또한 포함되므로 value 속성을 사용하여 기본값을 설정하는 것이 좋음.
  -->
  <textarea name="content" id="content" cols="50" rows="10" placeholder="input your message"></textarea>
        <br><br>
        <input type="submit" value="전송">

        <!--
        image type은 submit type과 동일하게 폼 데이터를 전송하지만,
        버튼 대신 이미지를 클릭하여 전송할 수 있음.
        -->
        <input type="image" src="./img/dog.gif" alt="강아지 전송 버튼">
    </form>
</body>
</html>
