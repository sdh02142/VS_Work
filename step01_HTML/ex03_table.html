<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>table 만들기 (3행 2열)</h1>
    <table border="1" width="200">
        <tr>
            <th colspan="2">1행</th>
        </tr>
        <tr>
            <td>2행 1열</td>
            <td rowspan="2">2행 2열</td>
        </tr>
        <tr>
            <td>3행 1열</td>
        </tr>
    </table>
    <hr>
    <h1>table 만들기 (2행 2열)</h1>
    <table border="1" width="200">
        <tr>
            <th>1행 1열</th>
            <td rowspan="2">2열</td>
        </tr>
        <tr>
            <td>2행 1열</td>
        </tr>
    </table>
    <hr>
    <h1>table 만들기 (2행 2열)</h1>
    <table border="1" width="200">
        <tr>
            <th colspan="2">1행</th>
        </tr>
        <tr>
            <td>2행 1열</td>
            <td>2행 2열</td>
        </tr>
    </table>
    <hr>
    
    <table border="1" width="200">
        <caption>table 만들기 (8행 3열)</caption>
        <tr align="center">
            <td colspan="3">A</td>
        </tr>
        <tr align="center">
            <td rowspan="3">b</td>
            <td colspan="2">c</td>
        </tr>
        <tr align="center">
            <td>d</td>
            <td>e</td>
        </tr>
        <tr align="center">
            <td>f</td>
            <td>g</td>
        </tr>
        <tr align="center">
            <td colspan="3">h</td>
        </tr>
        <tr align="center">
            <td rowspan="3">i</td>
            <td>j</td>
            <td>k</td>
        </tr>
        <tr align="center">
            <td>e</td>
            <td>f</td>
        </tr>
        <tr align="center">
            <td>g</td>
            <td>h</td>
        </tr>
    </table>
    <hr>
    <h1>The thead, tbody, and tfoot elements</h1>

<table border="1" width="200">
  <thead>
    <tr>
      <th>Month</th>
      <th>Savings</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>January</td>
      <td>$100</td>
    </tr>
    <tr>
      <td>February</td>
      <td>$80</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td>Sum</td>
      <td>$180</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
