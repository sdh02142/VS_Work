<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>var(ES5 이전), let, const</h3>
    <script>
        /*
        let, const 선언

        let 변수 이름;
        let 변수 이름 = 값;

        let : 동일한 이름 재선언 불가
              호이스팅은 되지만 선언 전에 사용 불가(Temporal Dead Zone - TDZ)
        */

       let a;
       let b = 20;
       c = 3.14

       // 브라우저 출력
       document.write("<h4>");
       document.write("a = " + a + ", "+ (typeof(a)) + "<br>");
       document.write("b = " + b + ", "+ (typeof(b)) + "<br>");
       document.write("c = " + c + ", "+ (typeof(c)) + "<br><br>");

       // 값 변경
       a = "Hello, World!";
       b = new Array(1, 'hi', 20, 3.14, true); // -> object
       c = false;

       // 브라우저 재출력 (let : 변수의 재사용은 가능.)
       document.write("a = " + a + ", "+ (typeof(a)) + "<br>");
       document.write("b = " + b + ", "+ (typeof(b)) + "<br>");
       document.write("c = " + c + ", "+ (typeof(c)) + "<br><br>");

       // 1. 함수 선언식
       function test(){
        console.log("test() called");
       }

       // 2. 함수 표현식
       let test2 = function(){
        console.log("test2() called");
       }

       // 함수 표현식의 권장사항은 const로 선언 및 사용하는 것
       // const는 반드시 선언과 동시에 초기화(값 부여)가 이루어져야함. -> 함수를 const에 담는 순간 이루어짐.
       // const는 값이 부여되고 나면 상수(Java의 final)처럼 변경 불가 및 재사용 안 됨. -> 안정성
       test();
       test2();
    </script>
    <hr>
    <h3>변수의 scope</h3>
    <script>
        var i = 0;
        function test3(){
            var i = 5;
            var j = 20;
            k = 50 // var 생략 시 무조건 전역변수

            document.write("<h3>i = " + i + "</h3>");
            document.write("<h3>this.i = " + this.i + "</h3>");
            document.write("<h3>j = " + j + "</h3>");
            document.write("<h3>k = " + k + "</h3>");
        }

        /*
        위 함수에서의 this는 해당 함수를 호출하는 대상을 기준으로 this가 됨.
        document의 body에서 해당 함수를 호출하므로 대상은 window가 되어
        전역변수 영역으로 접근이 가능해짐 -> 전역변수로 선언한 i = 0 이 호출됨.
        */

        function test4(){
            document.write("<h3>i = " + i + "</h3>"); // 전역변수 i = 0을 가리킴
            document.write("<h3>this.i = " + this.i + "</h3>");
            //document.write("<h3>j = " + j + "</h3>");
            document.write("<h3>k = " + k + "</h3>");
        }

        test3();
        test4();

        // const -> 상수, 선언과 동시에 초기화가 이루어져야함.
        // let은 재사용이 가능하여 로직 구성 중에 재사용될 경우,
        // 초기값으로 함수 부여했던 변수가 일반 변수로 변하여 추적하기
        // 까다로울 수 있지만 const로 선언 및 초기화된 함수는 변경되지 않아
        // 안정성 측면에서 권장됨.

        const info = "Hi";
        let info2;

        info2 = function(){
            console.log("info2() called.");
        }

        const info3 = function(){
            console.log("info3() called.");
        }

        info2();
        info3();

        info2 = "Hello";
        console.log(info2)
    </script>
</body>
</html>
