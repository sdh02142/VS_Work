<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const test01 = (th) => {
            console.log(`click1 clicked.`);
            th.style.color = "red";
        }

        const test02 = () => {
            console.log(`click2 clicked.`);
            event.target.style.color = 'blue'; // event는 특정 이벤트가 발생할 때의 그 순간 일어난 event를 대상으로 함.
        }

        const test03 = () => {
            console.log(`click3 clicked.`);
            event.target.style.color = 'green'; // event는 특정 이벤트가 발생할 때의 그 순간 일어난 event를 대상으로 함.
        }

        const test04 = () => {
            console.log(`click4 clicked.`);
            event.target.style.color = 'orange'; // event는 특정 이벤트가 발생할 때의 그 순간 일어난 event를 대상으로 함.
        }

        // html문서가 body부분까지 load 된 후 이벤트 등록
        /* window 생략(js에서의 최상위 객체) */onload = () => {
            // document.getElementById("btn2")
            const btn2 = document.querySelector("#btn2");
            // console.log(btn2)

            btn2.onclick = test02;

            const btn3 = document.querySelector(".btn3");
            btn3.addEventListener("click", test03);

            // 모든 button에 mouseover, mouseout 이벤트 적용
            const btnList = document.querySelectorAll("button");
            // console.log(btnList); // NodeList의 배열로 나옴.
            
            btnList.forEach((ele, index)=>{
                // console.log(ele + " / " + index);
                ele.addEventListener("mouseover", () => {
                    event.target.style.width="100px";
                    event.target.style.height="50px";
                    event.target.style.border="3px red double";
                });
                ele.addEventListener("mouseout", () => {
                    event.target.style.width="48px";
                    event.target.style.height="25px";
                    event.target.style.border="1px solid black";
                    
                })
            })
        } // onload End
    </script>
</head>
<body>
    <h2>Event Handling</h2>
    <button onclick="test01(this)">클릭1</button>
    <button id="btn2">클릭2</button>
    <button class="btn3">클릭3</button>
    <button>클릭4</button>
</body>
</html>
