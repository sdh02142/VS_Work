<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    JavaScript 적용 방법
    1) 태그에 직접 적용(태그에는 대소문자 구분 없음. 다만, JavaScript 영역부터는 대소문자 구분해야함.)
    -->
    <h2 onclick="this.style.backgroundColor='red'; this.style.color='white'" style="color: blue;">JavaScript</h2>
    <h2 onclick="this.style.backgroundColor='red'; this.style.color='white'"
    onmouseover="this.style.textDecoration='underline'"
    onmouseout="this.style.textDecoration='none'">Happy Monday</h2>
</body>
</html>
