<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Date, Math, Array 객체</h2>
    <script>
        //날짜 생성
        const today = new Date();
        document.write(`${today}<br>`);

        /*
        const month = new Date(2025, 9, 10); // -> 10월 10일, month은 0부터 11까지 ->> 1부터 12월
        const today2 = new Date(2025, 9, 10, 5, 25, 30); // --> 5시 25분 30초
        document.write(`${month}<br>`);
        document.write(`${today2}<br>`);
        */

        document.write(`${today.getFullYear()}년<br>`);
        document.write(`${today.getMonth()}월<br>`); // => 0 ~ 11
        document.write(`${today.getDate()}일<br>`); // => 0 ~ 6 => 일 월 화 수 목 금 토
        document.write(`${today.getDay()}요일<br>`);

        document.write(`${today.toLocaleString()}<br>`);

        document.write(`<br>----------------------------------------------------<br><br>`);

        let num = Math.random(); // 0.0 ~ 0.9999 사이
        document.write(`${num}<br>`);

        // ex) 1 ~ 5 사이의 난수
        num = (num*5)+1;
        document.write(`${num}<br>`);

        num = Math.floor(num);
        document.write(`${num}<br>`);

        document.write(`<br>----------------------------------------------------<br><br>`);
        // Array
        const arr1 = [];
        const arr2 = new Array(1, true, 'sleep');
        const arr3 = [1, 3, 5, 7, false];

        const arr4 = [
            [1, 2, 3],
            [3, 6, 9],
            ['A', 'b'],
            [true, false, 3.14]
        ];

        const arr5 = [
            {name : 'hi', age : 20},
            {name : 'hello', age : 26},
            {name : 'bye', age : 32}
        ];

        document.write(`----- arr1 -----<br>`);
        document.write(`${arr1}<br>`);
        document.write(`${arr1.length}<br>`);
        document.write(`----- arr2 -----<br>`);
        document.write(`${arr2}<br>`);
        document.write(`${arr2.length}<br>`);
        document.write(`----- arr3 -----<br>`);
        document.write(`${arr3}<br>`);
        document.write(`${arr3.length}<br>`);
        document.write(`----- arr4 -----<br>`);
        document.write(`${arr4}<br>`);
        document.write(`${arr4.length}<br>`);
        document.write(`----- arr5 -----<br>`);
        document.write(`${arr5}<br>`);
        document.write(`${arr5.length}<br>`);
    </script>
</body>
</html>
