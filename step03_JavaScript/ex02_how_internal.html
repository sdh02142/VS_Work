<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // JavaScript 영역, JavaScript 문법 적용

        // 브라우저 출력(html markup 사용 가능.)
        document.write("<h1>Hello, JavaScript!</h1>");
        
        // 콘솔 출력
        console.log("Hello, JavaScript!");

        // h2태그에 onclick 했을 때, CSS 적용하는 기능(함수 function) 작성
        function onClickMethod(i) {
            console.log("function called.");
            console.log(i);
            i.style.backgroundColor='red';
            i.style.color='white';

            // h3 태그에 CSS 적용
            // 1) h3 태그 찾기(id 사용, 객체 직접 탐색, ... etc)
            const a = document.getElementById('a'); // id로 찾기

            // 2) 찾은 객체 CSS 적용
            a.style.border = '5px double orange';
            a.style.backgroundColor='blue';
            a.style.color='white';
        }
        /*
        JavaScript는 순차적으로 위에서 아래로 내려오면서 작업이 진행되기 때문에,
        body 이전에 작성한 script로는 body 요소에 접근할 수 없음.

        // h2 태그에 mouseover, mouseout 이벤트 적용
        // 1) 이벤트 적용할 대상(element) 찾기
        const b = document.getElementById('h2');
        console.log(b);

        // 2) 이벤트 등록
        */

        // 함수 정의
        function onMouseOver(){
            console.log('onMouseOver() called.')
        };
    </script>
</head>
<body>
    <!--
    JavaScript 적용 방법
    2) 현재 문서 내에 script 태그를 열고 닫아서 script 영역 안에서 작성
    -->
    <h2 onclick="onClickMethod(this)">JavaScript</h2>
    <h2 onclick="onClickMethod(this)" id="h2">Happy Monday</h2>
    <h3 id="a">Hello, World!</h3>

    <script>
        // h2 태그에 mouseover, mouseout 이벤트 적용
        // 1) 이벤트 적용할 대상(element) 찾기
        const c = document.getElementById('h2');
        console.log(c);
        
        // 2) 이벤트 등록
        // onmouseover는 반드시 모두 소문자 작성
        c.onmouseover = onMouseOver;

        // ※ 익명 함수 등록(해당 기능이 실행될 때만 호출 및 사용되는 함수로 일회성이면서 재활용이 안 됨. -> 해당 기능이 실행될 때 제외하고는 다른 곳에서 해당 함수를 호출할 수 없음.)
        c.onmouseout = function onMouseOut(){
            console.log('onMouseOut() called.');
        };
        
        /*
        JavaScript 내에서 어떤 함수를 등록(부여)하는 것과 호출하는 것의 차이는 ()의 유무로 판단되며,
        ()가 붙은 함수 [func()] <- script가 읽어질 때 즉시 실행됨.(호출)
        ()가 붙지 않은 함수 [func] <- 해당 함수가 등록된 함수 또는 기능이 실행될 때 호출됨.(부여)
        */
    </script>
</body>
</html>
