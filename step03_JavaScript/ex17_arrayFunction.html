<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Array Function</h2>
    <script>
        const students =[
{name:"A", age:20 , state:true , score:80},
{name:"B", age:29 , state:true , score:85},
{name:"C", age:22 , state:false , score:90},
{name:"D", age:21 , state:true , score:45},
{name:"E", age:28 , state:false , score:95},
];
//1. 점수가 90점인 학생 정보 - find()
let re = students.find(s => s.score >= 90); // => 배열을 순차적으로 돌면서 조건에 맞는 요소를 발견하면 해당 요소를 반환하고 멈춤.
console.log(re);
document.write(`${re}<br>`);
re = students.findIndex(s=>s.score >= 90);
console.log(re);
document.write(`${re}<br>`);

//2. 점수가 90점인 이상인 모든 학생 - filter() // 조건에 해당하는 모든 요소 반환
re = students.filter(s=>s.score >= 90);
console.log(re);
document.write(`${re}<br>`);

//3. 수강중(state-true) 학생들만 골라서 배열로 만들기. - filter()
re = students.filter(s=>s.state);
console.log(re);
document.write(`${re}<br>`);

//4.학생 배열에서 점수만 뽑아서 배열로 만들기 - map()
re = students.map(s=>s.score);
console.log(re);
document.write(`${re}<br>`);

//5.학생 들중에 점수가 50점 보다 낮은 친구 있는지 없는지 체크하기-some()
re = students.some(s=>s.score < 50);
console.log(re);
document.write(`${re}<br>`);

//6. 모든 학생들의 점수가 80이상인지 체크 -every()
re = students.every(s=>s.score >= 80);
console.log(re);
document.write(`${re}<br>`);

//7.학생들의 평균점수를 구하기 - reduce()
re = students.reduce((num, s)=>num + s.score, 0);
console.log(re/students.length);
document.write(`${re/students.length}<br>`);

//8. 학생들의 모든 점수를 구해서 하나의 string으로 변환(map , join)
re = students.map(s => s.score).join(', ');
console.log(re);
document.write(`${re}<br>`);

//9.학생들의 모든 점수를 배열로 만들어서 50점 이상인 학생들만 뽑아서 하나의 string으로 변환 (map, filter, join)
re = students.map(s => s.score).filter(n => n >= 50).join(', ');
console.log(re);
document.write(`${re}<br>`);

//10.학생들의 점수를 정렬하기. - sort()
let re1 = [...students];
re = re1.sort((s1, s2) => s1.score - s2.score);
console.log(re);
document.write(`${re}<br>`);

//10.학생들의 점수를 내림차순 정렬하기. - reverse()
let re2 = [...students];
re = re2.sort((s1, s2) => s1.score - s2.score).reverse();
console.log(re);
document.write(`${re}<br>`);

</script>
</body>
</html>
