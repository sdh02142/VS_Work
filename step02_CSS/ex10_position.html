<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* position은 지정하지 않을 경우, 기본값 = static */
        .main{
            width: 500px; height: 400px;
            background-color: pink;
        }

        div.main > div{
            width: 80px; height: 80px;
        }

        .a{
            background-color: red;
            position: relative;
            z-index: 12; /* position이 기본값이면 적용되지 않음. */
        }

        .b{
            background-color: green;
            position: absolute;
            top:50px;
            left:20px;
            z-index: 10;
        }
        /* 
        position이 static(기본값)인 객체들 사이에 relative가 지정되면
        해당 객체는 relative 위치로 지정되고 나머지 근접한 객체들은
        해당 객체가 static일 때의 위치를 기준으로 위치하게 됨.

        relative로 지정하면 다른 객체들(기본값) 프레임의 위에서 조정한 수치 값에 따라
        위치하게 됨.
        */

        /*
        absolute는 지정된 객체의 바로 윗 부모 객체를 기준으로 위치하게 되고,
        근접한 형제 객체들은 해당 객체의 기존 위치를 무시하고 위치하게 됨.
        */

        .c{
            background-color: blue;
            position: relative;
            top: 10px;
            left: 40px;
            z-index: 11;
        }
        
        .todayView{
            width: 150px; height: 200px;
            border: inset 3px skyblue;
            box-sizing: border-box;
            position: fixed;
            right: 20px;
            top:20px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="a">1</div>
        <div class="b">2</div>
        <div class="c">3</div>
    </div>
    <div class="todayView">
        <h4>오늘 본 상품</h4>
    </div>
    <h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3><h3>Today</h3>
</body>
</html>
