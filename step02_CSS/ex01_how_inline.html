<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    태그에 직접 CSS 적용
    - 재사용 어려움.
    - 간단히 한 두개의 속성을 바로 적용할 때 사용.
    - 처리 우선 순위가 가장 높음. (inline style > internal style > external style)
    -->
    <h1 style="color: blue; text-decoration: underline;">CSS 적용하기 1</h1>
    <h1 style="color: red;">CSS 적용하기 2</h1>
    <h2 style="color: green;">CSS 적용하기 3</h2>
</body>
</html>
