<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 100vh;
            background-color: aliceblue;
            display: grid;
            /*
            grid-template-columns: 100px 200px 100px;
            grid-template-columns: repeat(3, 150px) 100px;
            */
            grid-template-columns: 1fr 2fr 1fr;
            /* fraction : 보여지는 영역 전체를 숫자 비율로 나뉘어 표현됨. 1 : 2 : 1 */
            
            grid-auto-rows: 100px;


            row-gap: 10px;
            column-gap: 10px;
        }
        /*
        grid로 영역 크기 부여해도 자녀 객체가 해당 영역을 100% 차지하지 않고
        별개의 size를 갖게 되면 부여한 영역에 종속되지 않고 본연의 size를 유지함.
        */
        img{
            width: 100%;
            height: 100%;
            border-radius: 10px;
            opacity: 0.7;
        }

        .img1{
            grid-column-start: 1;
            grid-column-end: 3;

            grid-row-start: 1;
            grid-row-end: 4;
        }

        .img2{
            grid-column: 3/4;
            /*
            grid-column-start: 3;
            grid-column-end: 4;
            */
            grid-row: 1/4;
            /*
            grid-row-start: 1;
            grid-row-end: 4;
            */
        }

        .img3{
            grid-column: 1/ span 2;
            /*
            grid-column-start: 1;
            grid-column-end: 3;
            */
            grid-row: 4 / span 2;
            /*
            grid-row-start: 4;
            grid-row-end: 6;
            */
        }
    </style>
</head>
<body>
    <!-- di.main>img.img$*7 -->
    <div class="main">
        <img src="https://picsum.photos/id/100/200" alt="" class="img1"><img src="https://picsum.photos/id/200/200" alt="" class="img2"><img src="https://picsum.photos/id/300/200" alt="" class="img3"><img src="https://picsum.photos/id/400/200" alt="" class="img4"><img src="https://picsum.photos/id/500/200" alt="" class="img5"><img src="https://picsum.photos/id/600/200" alt="" class="img6"><img src="https://picsum.photos/id/700/200" alt="" class="img7">
    </div>
</body>
</html>
