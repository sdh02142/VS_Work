<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display: grid;
            grid-template-columns: 3fr 1fr;
            grid-template-rows: 100px auto 150px;

            /* grid의 각 영역에 이름 부여 및 영역 분배 */
            grid-template-areas: 
            'h h'
            'm a'
            'f f';
        }

        header{
            background-color: aqua;
            grid-area: h;
        }

        main{
            background-color: yellowgreen;
            grid-area: m;
        }

        aside{
            background-color: pink;
            grid-area: a;
        }

        footer{
            background-color: bisque;
            grid-area: f;
        }

        img{
            width: 100%;
            height: 100%;
            opacity: 0.8;
            border-radius: 10px;
        }
        .main{
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr) /* 현재 선언된 영역에 하위 요소들을 3칸으로 나누어서 1fr의 크기로 가로를 채움. */;
            grid-auto-rows: 100px;
            padding: 50px;
            gap: 10px;
            grid-template-areas: 
            'a a a'
            'b c c'
            'd e f'
            'g e f';
        }

        .img1{
            grid-area: a;
        }

        .img2{
            grid-area: b;
        }

        .img3{
            grid-area: c;
        }

        .img4{
            grid-area: d;
        }

        .img5{
            grid-area: e;
        }

        .img6{
            grid-area: f;
        }

        .img7{
            grid-area: g;
        }
        /*
        header{
            background-color: aqua;
            grid-column-start: 1;
            grid-column-end: 3;

            grid-row: 1/2;
        }

        main{
            background-color: yellowgreen;
            grid-column-start: 1;
            grid-column-end: 2;

            grid-row: 2/3;
        }

        aside{
            background-color: pink;
            grid-column-start: 2;
            grid-column-end: 3;

            grid-row: 2/3;
        }

        footer{
            background-color: bisque;
            grid-column-start: 1;
            grid-column-end: 3;

            grid-row: 3/4;
        }
        */
    </style>
</head>
<body>
    <header>header</header>
    <main>
        <div class="main">
        <img src="https://picsum.photos/id/100/200" alt="" class="img1"><img src="https://picsum.photos/id/200/200" alt="" class="img2"><img src="https://picsum.photos/id/300/200" alt="" class="img3"><img src="https://picsum.photos/id/400/200" alt="" class="img4"><img src="https://picsum.photos/id/500/200" alt="" class="img5"><img src="https://picsum.photos/id/600/200" alt="" class="img6"><img src="https://picsum.photos/id/700/200" alt="" class="img7">
    </div>
</main>
    <aside>aside</aside>
    <footer>footer</footer>
</body>
</html>
